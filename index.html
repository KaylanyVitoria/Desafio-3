<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mapas | Anuário do Ceará</title>

    <link rel="stylesheet" href="./css/style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <!-- Cabeçalho branco -->
    <header class="cabecalho">

        <button
            class="botao-icone"
            type="button"
            aria-label="Abrir menu"
        >
            <i class="fa-solid fa-bars"></i>
        </button>

        <div class="logo">
            <a href="#" aria-label="Página inicial do Anuário do Ceará">
                <img
                    src="./images/logo-anuário.svg"
                    alt="Anuário do Ceará"
                >
            </a>
        </div>

        <button
            class="botao-icone"
            type="button"
            aria-label="Pesquisar"
        >
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>

    </header>

    <!-- Navegação vermelha -->
    <nav class="navegacao" aria-label="Navegação de Fortaleza">

        <h2>Fortaleza</h2>

        <div class="links-navegacao">
            <a href="#">Fortaleza em Síntese</a>

            <a href="#">
                Contribuintes ISS (2021)
            </a>

            <a href="#">Prefeitura</a>

            <a href="#" class="ativo">
                Mapas
            </a>

            <a href="#">Organograma</a>
        </div>

    </nav>

    <!-- Conteúdo principal -->
    <main class="conteudo">

        <div class="breadcrumb" aria-label="Caminho de navegação">

            <a href="#">Início</a>

            <span aria-hidden="true">»</span>

            <a href="#">Fortaleza</a>

            <span aria-hidden="true">»</span>

            <span>Mapas</span>

        </div>

        <h1>Mapas</h1>

        <section class="accordion">

            <!-- Item 1 -->
            <article class="accordion-item">

                <button
                    class="accordion-titulo"
                    type="button"
                    aria-expanded="false"
                >
                    <span class="accordion-icone">+</span>

                    <span class="accordion-texto">
                        Territórios Administrativos de Fortaleza
                    </span>
                </button>

                <div class="accordion-conteudo">

                    <img
                        class="mapa"
                        src="./images/mapa1.jpg"
                        alt="Mapa dos territórios administrativos de Fortaleza"
                    >

                </div>

            </article>

            <!-- Item 2 -->
            <article class="accordion-item">

                <button
                    class="accordion-titulo"
                    type="button"
                    aria-expanded="false"
                >
                    <span class="accordion-icone">+</span>

                    <span class="accordion-texto">
                        Região Metropolitana de Fortaleza
                    </span>
                </button>

                <div class="accordion-conteudo">

                    <img
                        class="mapa"
                        src="./images/mapa2.jpg"
                        alt="Mapa da Região Metropolitana de Fortaleza"
                    >

                </div>

            </article>

            <!-- Item 3 -->
            <article class="accordion-item">

                <button
                    class="accordion-titulo"
                    type="button"
                    aria-expanded="false"
                >
                    <span class="accordion-icone">+</span>

                    <span class="accordion-texto">
                        Índice de Cobertura de Esgoto de Fortaleza
                    </span>
                </button>

                <div class="accordion-conteudo">

                    <img
                        class="mapa"
                        src="./images/mapa3.jpg"
                        alt="Mapa do índice de cobertura de esgoto de Fortaleza"
                    >

                </div>

            </article>

            <!-- Item 4 -->
            <article class="accordion-item">

                <button
                    class="accordion-titulo"
                    type="button"
                    aria-expanded="false"
                >
                    <span class="accordion-icone">+</span>

                    <span class="accordion-texto">
                        Faixas Exclusivas de Fortaleza
                    </span>
                </button>

                <div class="accordion-conteudo">

                    <img
                        class="mapa"
                        src="./images/mapa4.jpg"
                        alt="Mapa das faixas exclusivas de Fortaleza"
                    >

                </div>

            </article>

            <!-- Item 5 -->
            <article class="accordion-item">

                <button
                    class="accordion-titulo"
                    type="button"
                    aria-expanded="false"
                >
                    <span class="accordion-icone">+</span>

                    <span class="accordion-texto">
                        Divisão das Regionais de Fortaleza
                    </span>
                </button>

                <div class="accordion-conteudo">

                    <img
                        class="mapa"
                        src="./images/mapa5.jpg"
                        alt="Mapa da divisão das regionais de Fortaleza"
                    >

                </div>

            </article>

            <!-- Item 6 -->
            <article class="accordion-item">

                <button
                    class="accordion-titulo"
                    type="button"
                    aria-expanded="false"
                >
                    <span class="accordion-icone">+</span>

                    <span class="accordion-texto">
                        Áreas Integradas de Segurança (AIS) da Capital
                    </span>
                </button>

                <div class="accordion-conteudo">

                    <img
                        class="mapa"
                        src="./images/mapa6.jpg"
                        alt="Mapa das Áreas Integradas de Segurança da Capital"
                    >

                </div>

            </article>

        </section>

    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="./script/script.js"></script>

</body>

</html>
